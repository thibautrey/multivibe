<style>
#mv-mac{--mv-bg:light-dark(#fafbf9,#181d1a);--mv-panel:light-dark(#fff,#222925);--mv-side:light-dark(#edf0eb,#202923);--mv-text:light-dark(#18241d,#edf5f0);--mv-muted:light-dark(#657168,#a2b3a8);--mv-line:light-dark(#dde3dd,#39443b);--mv-green:light-dark(#087443,#72f7b9);--mv-soft:light-dark(#dcefe1,#284335);--mv-danger:light-dark(#b8383e,#ff9295);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--mv-text);color-scheme:light dark}
#mv-mac *{box-sizing:border-box}#mv-mac button,#mv-mac input,#mv-mac select,#mv-mac textarea{font:inherit;color:inherit}#mv-mac button{border:1px solid var(--mv-line);border-radius:7px;padding:5px 11px;background:var(--mv-panel);display:inline-flex;align-items:center;justify-content:center;gap:7px}#mv-mac button:hover{background:var(--mv-soft)}#mv-mac button:disabled{opacity:.5}#mv-mac .primary{background:var(--mv-green);color:light-dark(#fff,#102418);border-color:transparent}#mv-mac .subtle{color:var(--mv-muted)}#mv-mac .designbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 0 14px}#mv-mac .designbar label{margin-left:auto}#mv-mac select,#mv-mac input,#mv-mac textarea{background:var(--mv-panel);border:1px solid var(--mv-line);border-radius:6px;padding:7px 9px;max-width:100%}#mv-mac .window{border:1px solid var(--mv-line);border-radius:13px;overflow:hidden;background:var(--mv-bg);box-shadow:0 15px 35px #00000012}#mv-mac .titlebar{display:grid;grid-template-columns:202px 1fr;min-height:57px;border-bottom:1px solid var(--mv-line);background:var(--mv-panel)}#mv-mac .traffic{display:flex;gap:8px;align-items:center;padding:0 19px;background:var(--mv-side)}#mv-mac .traffic span{width:12px;height:12px;border-radius:50%;background:#ff6059}#mv-mac .traffic span:nth-child(2){background:#ffbd2e}#mv-mac .traffic span:nth-child(3){background:#28c840}#mv-mac .toolbar{display:flex;align-items:center;gap:12px;padding:10px 20px}#mv-mac .toolbar strong{font-size:14px;font-weight:600}#mv-mac .toolbar .right{margin-left:auto}#mv-mac .body{display:grid;grid-template-columns:202px minmax(0,1fr);min-height:590px}#mv-mac aside{background:var(--mv-side);padding:15px 11px;display:flex;flex-direction:column;border-right:1px solid var(--mv-line)}#mv-mac .brand{font-size:19px;font-weight:650;letter-spacing:-.6px;padding:2px 10px 18px}#mv-mac .brand span{color:var(--mv-green)}#mv-mac .group{color:var(--mv-muted);font-size:11px;font-weight:600;padding:17px 11px 6px}#mv-mac aside button{justify-content:flex-start;border:none;background:transparent;padding:7px 11px;width:100%;margin:1px 0;text-align:left}#mv-mac aside button.selected{background:var(--mv-soft);color:var(--mv-green);font-weight:600}#mv-mac aside .bottom{margin-top:auto;padding-top:18px}#mv-mac main{min-width:0;padding:27px 30px}#mv-mac h1{font-size:25px;line-height:1.2;letter-spacing:-.65px;font-weight:650;margin:0 0 8px}#mv-mac h2{font-size:15px;font-weight:600;margin:0 0 14px}#mv-mac h3{font-size:13px;font-weight:600;margin:0}#mv-mac p{margin:0 0 17px}#mv-mac .heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}#mv-mac .heading p{margin:0}#mv-mac .box{border:1px solid var(--mv-line);background:var(--mv-panel);border-radius:10px;padding:18px;margin-bottom:18px}#mv-mac .row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--mv-line)}#mv-mac .row:last-child{border-bottom:none}#mv-mac .row small{display:block;color:var(--mv-muted);font-size:12px}#mv-mac .badge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 7px;background:var(--mv-soft);color:var(--mv-green);white-space:nowrap;font-size:11px;font-weight:500}#mv-mac .warn{color:light-dark(#986020,#f3c987);background:light-dark(#fff3dc,#493b26)}#mv-mac .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:22px 0 26px}#mv-mac .metric strong{display:block;font-size:27px;letter-spacing:-.8px;font-weight:550}#mv-mac .metric span{color:var(--mv-muted);font-size:12px}#mv-mac .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}#mv-mac .tabs{display:flex;gap:3px;flex-wrap:wrap;padding:3px;background:var(--mv-side);border-radius:8px;margin:0 0 23px;width:fit-content}#mv-mac .tabs button{border:none;background:transparent;padding:4px 12px}#mv-mac .tabs button.active{background:var(--mv-panel);box-shadow:0 1px 3px #00000018}#mv-mac table{border-collapse:collapse;width:100%;font-size:12px}#mv-mac th{text-align:left;font-weight:500;color:var(--mv-muted);padding:9px 9px;border-bottom:1px solid var(--mv-line)}#mv-mac td{padding:13px 9px;border-bottom:1px solid var(--mv-line)}#mv-mac tbody tr:hover{background:var(--mv-soft)}#mv-mac .tablewrap{overflow-x:auto}#mv-mac .footer{padding:7px 15px;border-top:1px solid var(--mv-line);display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--mv-muted)}#mv-mac .center{max-width:470px;margin:40px auto;text-align:center}#mv-mac .appicon{margin:0 auto 24px;background:var(--mv-soft);color:var(--mv-green);border:1px solid var(--mv-line);border-radius:23px;width:80px;height:80px;display:grid;place-items:center;font-size:36px;font-weight:650;letter-spacing:-7px;padding-right:6px}#mv-mac .form{text-align:left;display:grid;gap:15px}#mv-mac .form label{display:grid;gap:6px}#mv-mac .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px;flex-wrap:wrap}#mv-mac .wide{width:100%}#mv-mac .route{display:flex;align-items:center;gap:12px;padding:15px;background:var(--mv-side);border-radius:8px;margin:12px 0;flex-wrap:wrap}#mv-mac .route strong{color:var(--mv-green)}#mv-mac code,#mv-mac pre{font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}#mv-mac pre{white-space:pre-wrap;margin:0;padding:17px;background:var(--mv-side);border-radius:8px}#mv-mac .bar{height:6px;border-radius:3px;background:var(--mv-side);margin:8px 0;overflow:hidden}#mv-mac .bar i{height:100%;display:block;background:var(--mv-green)}#mv-mac .avatar{width:33px;height:33px;border:1px solid var(--mv-line);border-radius:8px;display:grid;place-items:center;font-weight:600;background:var(--mv-side);flex-shrink:0}#mv-mac .leading{display:flex;align-items:center;gap:12px}#mv-mac .toast{padding:10px 0;color:var(--mv-green);min-height:36px}#mv-mac .screenlabel{font-size:12px;color:var(--mv-muted)}#mv-mac .menu{max-width:340px;margin:25px auto;border-radius:12px;box-shadow:0 12px 35px #00000020}#mv-mac .menu button{display:flex;justify-content:space-between;width:100%;border:0;padding:8px;text-align:left}#mv-mac .compact .row{padding:8px 0}#mv-mac .compact td{padding:8px}#mv-mac .chart{height:105px;display:flex;align-items:end;gap:7px;border-bottom:1px solid var(--mv-line);padding-top:10px}#mv-mac .chart i{flex:1;background:var(--mv-green);opacity:.7;border-radius:3px 3px 0 0}#mv-mac .chartlabels{display:flex;justify-content:space-between;color:var(--mv-muted);font-size:11px;margin-top:6px}#mv-mac .hint{font-size:12px;color:var(--mv-muted)}#mv-mac .danger{color:var(--mv-danger)}#mv-mac .mini{font-size:11px;color:var(--mv-muted)}
@media(max-width:760px){#mv-mac .body,#mv-mac .titlebar{grid-template-columns:165px minmax(0,1fr)}#mv-mac main{padding:22px 18px}#mv-mac .cols{grid-template-columns:1fr}#mv-mac .metrics{gap:10px}#mv-mac .metric strong{font-size:23px}}
@media(max-width:530px){#mv-mac .body,#mv-mac .titlebar{grid-template-columns:1fr}#mv-mac .traffic{padding:10px 16px}#mv-mac aside{display:none}#mv-mac main{padding:20px 15px}#mv-mac .heading{align-items:flex-start;flex-wrap:wrap}#mv-mac .designbar label{margin-left:0}#mv-mac .designbar select{width:100%}#mv-mac .metrics{grid-template-columns:1fr 1fr}#mv-mac .toolbar{padding:10px 15px}#mv-mac .row{flex-wrap:wrap}#mv-mac .footer{flex-wrap:wrap}}
</style>
<div id="mv-mac" aria-label="Maquettes MultiVibe pour macOS">
<div class="designbar"><span class="screenlabel" id="mv-count"></span><button id="mv-prev" aria-label="Maquette précédente">←</button><button id="mv-next" aria-label="Maquette suivante">→</button><label for="mv-screen">Écran</label><select id="mv-screen" aria-label="Choisir une maquette"></select></div>
<div class="window"><div class="titlebar"><div class="traffic" aria-label="Commandes de fenêtre macOS"><span></span><span></span><span></span></div><div class="toolbar"><strong id="mv-title">Vue d’ensemble</strong><div class="right"><button data-go="menu" aria-label="Menu MultiVibe"><i data-lucide="panel-top" aria-hidden="true"></i></button></div><button data-go="settings" aria-label="Réglages"><i data-lucide="settings-2" aria-hidden="true"></i></button></div></div><div class="body"><aside id="mv-nav"></aside><main id="mv-content"></main></div><div class="footer"><span>● &nbsp; Mac de Thibaut · service local</span><span>Maquette · données fictives</span></div></div><div class="toast" id="mv-toast" role="status" aria-live="polite"></div>
</div>
<script>
(()=>{
const root=document.getElementById('mv-mac'), content=root.querySelector('#mv-content');
const state={screen:'overview',compact:false,appearance:'system'};
const ic=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const b=(label,go,primary=false)=>`<button class="${primary?'primary':''}" data-go="${go}">${label}</button>`;
const note=t=>`<p class="subtle">${t}</p>`;
const badge=(s,w=false)=>`<span class="badge ${w?'warn':''}">${s}</span>`;
const row=(title,sub,right='',go='')=>`<div class="row"><div><h3>${title}</h3><small>${sub}</small></div>${go?b(right,go):right}</div>`;
const box=(title,body)=>`<section class="box">${title?`<h2>${title}</h2>`:''}${body}</section>`;
const metrics=a=>`<div class="metrics">${a.map(([n,v,s])=>`<div class="metric"><span>${n}</span><strong>${v}</strong><span>${s||''}</span></div>`).join('')}</div>`;
const heading=(title,sub,action='')=>`<div class="heading"><div><h1>${title}</h1><p class="subtle">${sub}</p></div>${action}</div>`;
const table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const form=(fields)=>`<div class="form">${fields.map(([l,v,type])=>`<label>${l}${type==='select'?`<select>${v.split('|').map(x=>`<option>${x}</option>`).join('')}</select>`:type==='area'?`<textarea rows="4">${v}</textarea>`:`<input type="${type||'text'}" value="${v}">`}</label>`).join('')}</div>`;
const checks=arr=>arr.map(([label,on])=>`<div class="row"><label><input type="checkbox" ${on?'checked':''}> &nbsp;${label}</label></div>`).join('');
const actions=(...a)=>`<div class="actions">${a.join('')}</div>`;
const center=(title,sub,body)=>`<div class="center"><div class="appicon">M</div><h1>${title}</h1>${note(sub)}${body}</div>`;
const tabs=(arr,current)=>`<div class="tabs">${arr.map(([id,l])=>`<button data-go="${id}" class="${id===current?'active':''}">${l}</button>`).join('')}</div>`;
const chart=()=>`<div class="chart" role="img" aria-label="Exemple fictif du volume de requêtes dans la journée, hausse vers midi">${[18,25,20,35,29,42,54,39,60,78,65,94,81,70,57,68,54,39,48,32,24,30].map(v=>`<i style="height:${v}%"></i>`).join('')}</div><div class="chartlabels"><span>00 h</span><span>06 h</span><span>12 h</span><span>18 h</span><span>24 h</span></div>`;
const providerRows=()=>row('OpenAI','Compte personnel · abonnement','Gérer','provider')+row('Anthropic','API · équipe',badge('Connecté'))+row('Ollama','Local · 3 modèles',badge('Disponible'))+row('MultiVibe Cloud','Compte Cloud', 'Connecter','cloud');
const atabs=[['activity','Vue générale'],['performance','Performance'],['sessions','Sessions'],['usage','Coûts'],['requests','Requêtes']];
const screens=[];const add=(id,label,section,render)=>screens.push({id,label,section,render});
add('overview','Vue d’ensemble','overview',()=>heading('Tout est prêt.','Votre point d’accès IA, sur ce Mac.',badge('Service actif'))+metrics([['Fournisseurs','3','connectés'],['Modèles','24','disponibles'],['Requêtes','1 284','aujourd’hui']])+box('Activité du jour',chart())+`<div class="cols">${box('Vos applications',row('Codex','Connecté à MultiVibe',badge('Actif'))+row('Claude Code','Prêt à configurer','Configurer','tools'))}${box('Accès rapide',row('Modèle par défaut','coding → sélection automatique','Routage','routing')+row('Service local','127.0.0.1:8317','Accès API','api'))}</div>`);
add('models','Catalogue de modèles','models',()=>heading('Modèles','Choisissez où exécuter votre IA.',b('Modèles locaux','local'))+tabs([['models','Tous les modèles'],['local','Sur ce Mac'],['cloud','MultiVibe Cloud']],'models')+table(['Modèle','Origine','Contexte',''],[['GPT-5.3 Codex','OpenAI','400 k',b('Détails','model')],['Claude Sonnet','Anthropic','200 k',b('Détails','model')],['Qwen 3 · 8B','Ollama','32 k',b('Détails','local-model')],['Llama · 8B','À télécharger','128 k',b('Installer','download')]])+note('24 modèles disponibles · filtres et recherche dans la version native.'));
add('model','Détail d’un modèle','models',()=>heading('GPT-5.3 Codex','OpenAI · code et raisonnement',b('Tester','playground',true))+tabs([['model','Informations'],['model-variants','Variantes']],'model')+metrics([['Contexte','400 k','tokens'],['Premier token','0,8 s','exemple observé'],['Accès','Abonnement','Compte personnel']])+box('Utilisation',row('Compte utilisé','OpenAI · personnel',badge('Disponible'))+row('Routage','Disponible dans la règle coding','Modifier','routing-edit'))+box('Capacités',row('Entrées','Texte et images',badge('Compatible'))+row('Sortie','Texte · outils · streaming',badge('Compatible'))));
add('model-variants','Variantes et comparaison','models',()=>heading('Variantes','Choisissez le compromis adapté à votre Mac.')+tabs([['model','Informations'],['model-variants','Variantes']],'model-variants')+table(['Variante locale','Mémoire estimée','Précision',''],[['Qwen 3 · 8B · Q4','5,2 Go','4 bits',b('Installer','download')],['Qwen 3 · 8B · Q8','9,1 Go','8 bits',b('Installer','download')],['Qwen 3 · 8B · F16','17 Go','16 bits',badge('Mémoire limitée',true)]])+box('Conseil pour ce Mac',note('La variante Q4 laisse davantage de mémoire à vos applications. Les estimations seront calculées à partir du matériel détecté.')));
add('local','Modèles sur ce Mac','models',()=>heading('Sur ce Mac','Inférence locale avec Ollama, LM Studio ou MLX.',b('Découvrir','models'))+box('Moteurs',row('Ollama','Service démarré · 3 modèles',badge('Prêt'))+row('MLX','Optimisé pour Apple Silicon','Préparer','prepare')+row('LM Studio','Application non détectée',badge('Non installé',true)))+box('Modèles installés',row('Qwen 3 · 8B','5,2 Go · utilisé il y a 4 minutes','Gérer','local-model')+row('Llama · 8B','4,9 Go · non chargé','Gérer','local-model')));
add('prepare','Préparation d’un moteur local','models',()=>heading('Préparer MLX','Configurez le moteur pour Apple Silicon.')+box('Compatibilité',row('Apple Silicon','Matériel compatible',badge('Vérifié'))+row('Espace disponible','18 Go nécessaires · 142 Go disponibles',badge('Suffisant'))+row('Environnement MLX','Installation requise',badge('À préparer',true)))+note('Le moteur est installé pour MultiVibe. Les modèles se téléchargent séparément.')+actions(b('Annuler','local'),b('Préparer le moteur','download',true)));
add('download','Téléchargement d’un modèle','models',()=>heading('Installation en cours','Qwen 3 · 8B · Q4')+box('',row('Téléchargement','3,2 Go sur 5,2 Go','62 %')+'<div class="bar"><i style="width:62%"></i></div>'+note('Environ 2 minutes restantes · vérification du fichier après téléchargement.'))+actions(b('Annuler','local'),b('Voir le modèle installé','local-model',true)));
add('local-model','Gestion d’un modèle local','models',()=>heading('Qwen 3 · 8B','Ollama · installé sur ce Mac',badge('Prêt'))+metrics([['Espace disque','5,2 Go'],['Contexte','32 k'],['Mémoire','6,1 Go','estimation']])+box('Exécution',row('État','Le modèle est chargé en mémoire',badge('Chargé'))+row('Accès','Disponible via votre API locale','Tester','playground'))+actions(b('Décharger','local'),b('Supprimer du Mac…','delete-model')));
add('delete-model','Confirmation de suppression','models',()=>center('Supprimer ce modèle ?','Qwen 3 · 8B occupe 5,2 Go sur ce Mac.',box('',note('Il ne sera plus disponible pour les nouvelles requêtes locales. Vous pourrez le télécharger à nouveau.'))+actions(b('Annuler','local-model'),b('Supprimer','local',true))));
add('providers','Fournisseurs','providers',()=>heading('Fournisseurs','Comptes, accès et quotas.',b('Ajouter','provider-add',true))+box('',providerRows())+note('Les identifiants sensibles restent masqués.'));
add('provider','Compte et quotas','providers',()=>heading('OpenAI','Compte personnel',badge('Connecté'))+box('Quotas',row('Fenêtre de 5 heures','Réinitialisation à 16 h 30','38 % utilisés')+'<div class="bar"><i style="width:38%"></i></div>'+row('Limite hebdomadaire','Réinitialisation lundi','61 % utilisés')+'<div class="bar"><i style="width:61%"></i></div>')+box('Configuration',checks([['Utiliser ce compte pour le routage',true]])+row('Modèles exposés','12 modèles sélectionnés','Choisir','provider-models')+row('Crédits de réinitialisation','Aucun crédit disponible',badge('0 crédit')))+actions(b('Reconnecter','oauth'),b('Retirer le compte…','provider-remove')));
add('provider-add','Ajouter un fournisseur','providers',()=>heading('Ajouter un fournisseur','Choisissez le mode de connexion.')+box('',row('OpenAI / ChatGPT','Connexion à votre compte','Continuer','oauth')+row('Anthropic','Clé API','Continuer','provider-key')+row('Compatible OpenAI','Serveur personnalisé','Configurer','provider-key')+row('Moteur local','Ollama, LM Studio ou MLX','Configurer','local')+row('MultiVibe Cloud','Compte et modèles Cloud','Connecter','cloud')));
add('provider-key','Connexion par clé API','providers',()=>heading('Connecter un fournisseur','Anthropic · connexion API')+box('',form([['Nom du compte','Équipe'],['Clé API','','password']])+note('La clé sera conservée dans le Trousseau macOS.'))+actions(b('Annuler','providers'),b('Vérifier et connecter','provider',true)));
add('oauth','Connexion via navigateur','providers',()=>center('Connectez votre compte','L’authentification s’effectue dans votre navigateur sécurisé.',box('',row('Demande de connexion','En attente de votre autorisation…',badge('En attente',true)))+actions(b('Annuler','providers'),b('Simuler le retour réussi','provider',true))));
add('provider-models','Modèles exposés par compte','providers',()=>heading('Modèles exposés','OpenAI · compte personnel')+box('',checks([['GPT-5.3 Codex',true],['GPT-5.2',true],['GPT-5 mini',true],['Modèle image',false]]))+actions(b('Annuler','provider'),b('Enregistrer','provider',true)));
add('provider-remove','Retirer un compte','providers',()=>center('Retirer ce compte ?','OpenAI · compte personnel',note('Les règles qui utilisent ce compte passeront au prochain fournisseur disponible. Votre abonnement ne sera pas résilié.')+actions(b('Annuler','provider'),b('Retirer','providers',true))));
add('invoices','Factures','invoices',()=>heading('Factures','Abonnements et achats API.')+box('Septembre 2026',table(['Fournisseur','Date','Montant','Document'],[['OpenAI','01 sept.','20,00 $',b('Aperçu','invoice')],['Anthropic','01 sept.','42,80 $',b('Aperçu','invoice')],['MultiVibe Cloud','—','Indisponible',badge('Compte non connecté',true)]]))+note('Les montants et documents présentés sont des exemples.'));
add('invoice','Aperçu de facture','invoices',()=>heading('Facture OpenAI','Septembre 2026',b('Retour','invoices'))+box('OpenAI',row('Référence','Facture de démonstration','INV-DEMO-0926')+row('Abonnement','1 septembre – 30 septembre 2026','20,00 $')+row('Paiement','Payée le 1 septembre',badge('Payée')))+note('L’application native ouvrira le document avec l’aperçu système macOS.'));
add('routing','Routage','routing',()=>heading('Routage','Un nom stable, plusieurs modèles de secours.',b('Créer une règle','routing-edit',true))+box('',row('coding','Priorité à l’abonnement · repli local','Modifier','routing-edit')+'<div class="route"><strong>coding</strong><span>→ GPT-5.3 Codex</span><span>→ Qwen 3 · 8B</span></div>'+row('fast','Latence minimale · 2 candidats','Modifier','routing-edit'))+box('Requêtes avec images',row('Modèle dédié','Utiliser le choix automatique','Modifier','routing-edit')));
add('routing-edit','Édition d’une règle','routing',()=>heading('Règle coding','Ordre, conditions et modèles de secours.')+box('',form([['Nom de la règle','coding'],['Stratégie','Priorité|Moins occupé|Coût minimal','select']])+row('1 · GPT-5.3 Codex','OpenAI · personnel',badge('Principal'))+row('2 · Qwen 3 · 8B','Ollama · ce Mac',badge('Secours')))+box('Conditions',form([['Emplacement','Tous|Local|Cloud','select'],['Nombre maximal de tokens','32000']]))+actions(b('Simuler','routing-sim'),b('Enregistrer','routing',true)));

const picker=root.querySelector('#mv-screen');picker.innerHTML=screens.map((s,i)=>`<option value="${s.id}">${String(i+1).padStart(2,'0')} · ${s.label}</option>`).join('');
function render(){const s=screens.find(s=>s.id===state.screen)||screens[0];state.screen=s.id;const index=screens.indexOf(s);root.classList.toggle('compact',state.compact);root.style.colorScheme=state.appearance==='system'?'light dark':state.appearance;root.querySelector('#mv-title').textContent=s.label;root.querySelector('#mv-count').textContent=`${String(index+1).padStart(2,'0')} / ${screens.length} maquettes`;picker.value=s.id;root.querySelector('#mv-prev').disabled=index===0;root.querySelector('#mv-next').disabled=index===screens.length-1;root.querySelector('#mv-nav').innerHTML='<div class="brand">Multi<span>Vibe</span></div><div class="mini" style="padding:0 10px 8px">Mac de Thibaut</div>'+nav.map(([id,l,icon],i)=>(i===0?'<div class="group">ESPACE DE TRAVAIL</div>':i===6?'<div class="group">DÉVELOPPEMENT</div>':i===8?'<div class="group">SYSTÈME</div>':'')+`<button data-go="${id==='docs'?'playground':id}" class="${s.section===id?'selected':''}" ${s.section===id?'aria-current="page"':''}>${ic(icon)}${l}</button>`).join('')+'<div class="bottom">'+b(ic('cloud')+' Mon équipe','team')+b(ic('settings-2')+' Réglages','settings')+'</div>';content.innerHTML=s.render();root.querySelector('#mv-toast').textContent='';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:state.screen},privateContent:{compact:state.compact,appearance:state.appearance}}).catch(()=>{});}
function go(id){if(!screens.some(s=>s.id===id))return;state.screen=id;render();save();}
root.addEventListener('click',e=>{const el=e.target.closest('[data-go]');if(el)go(el.dataset.go);});picker.addEventListener('change',()=>go(picker.value));root.querySelector('#mv-prev').onclick=()=>go(screens[Math.max(0,screens.findIndex(s=>s.id===state.screen)-1)].id);root.querySelector('#mv-next').onclick=()=>go(screens[Math.min(screens.length-1,screens.findIndex(s=>s.id===state.screen)+1)].id);
function restore(saved){if(saved?.modelContent?.screen)state.screen=saved.modelContent.screen;if(saved?.privateContent){state.compact=!!saved.privateContent.compact;state.appearance=['system','light','dark'].includes(saved.privateContent.appearance)?saved.privateContent.appearance:'system';}}
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(state,'appearance',{label:'Apparence macOS',options:[{label:'Système',value:'system'},{label:'Clair',value:'light'},{label:'Sombre',value:'dark'}]});tweak.addToggle(state,'compact',{label:'Listes compactes'});}
