{% set tpl = ix_lib.base.render.Render(values) %}
{% set c1 = tpl.add_container(values.consts.host_container_name, "image") %}
{% do c1.set_user(0, 0) %}
{% do c1.set_init(true) %}
{% do c1.set_read_only(true) %}
{% do c1.set_grace_period(45) %}
{% do c1.healthcheck.use_built_in() %}
{% do c1.add_caps(["CHOWN", "FOWNER", "SETGID", "SETUID"]) %}
{% do c1.add_storage("/data", {"type": "host_path", "host_path_config": {"path": values.storage.data_path}}) %}
{% do c1.add_port(values.network.web_port, {"container_port": 1455}) %}
{% do c1.environment.add_env("MULTIVIBE_HOST_PUBLIC_URL", values.multivibe.public_url) %}
{% do tpl.portals.add(values.network.web_port) %}
{% set rendered = tpl.render() %}
{% do rendered.services[c1.name()].update({"platform": "linux/amd64", "tmpfs": ["/tmp:rw,nosuid,nodev,noexec,mode=1777,size=512m"]}) %}
{{ rendered | tojson }}
