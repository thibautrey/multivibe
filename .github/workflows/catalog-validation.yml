name: Runtime catalog validation

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.13'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: npm run catalog:check
      - run: go -C provider-agent test ./cmd/catalog-check ./runtimeprofile ./cmd/runtime-benchmark
      - name: Verify release archive fixtures
        run: node --test scripts/provider-host/package-provider-host.test.mjs scripts/provider-host/verify-provider-host-archive-fixtures.test.mjs
