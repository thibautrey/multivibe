name: Publish Host image to Docker Hub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable Host release tag (for example v0.2.32)
        required: true
        type: string
permissions:
  contents: read
  attestations: read
concurrency:
  group: multivibe-dockerhub
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install registry copy utility
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Mirror the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/distribution/publish-dockerhub.sh
