name: Provider Host Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      self_hosted_only:
        description: Build only configured self-hosted platforms
        type: boolean
        default: false

permissions: {}

concurrency:
  group: provider-host-release
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.2
  GO_VERSION: "1.25.13"

jobs:
  validate-tag:
    runs-on: multivibe-linux
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.value }}
      macos_matrix: ${{ steps.macos.outputs.matrix }}
      macos_enabled: ${{ steps.macos.outputs.enabled }}
    steps:
      - name: Require a release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::Provider Host releases must run from a v-prefixed tag."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The release tag is not a supported semantic version."
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Select native Mac runners when configured
        id: macos
        env:
          ARM_RUNNER: ${{ vars.MACOS_ARM64_RUNNER || 'macos-15' }}
          INTEL_RUNNER: ${{ vars.MACOS_AMD64_RUNNER || 'macos-15-intel' }}
          HOSTED_DISABLED: ${{ vars.HOSTED_RELEASE_BUILDS_ENABLED == 'false' || inputs.self_hosted_only }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          entries = []
          for arch, machine, key, hosted in [('arm64', 'arm64', 'ARM_RUNNER', 'macos-15'), ('amd64', 'x86_64', 'INTEL_RUNNER', 'macos-15-intel')]:
              runner = os.environ[key]
              native = 'multivibe-macos-' + arch
              gui = native + '-gui'
              if runner not in [native, gui, hosted]: raise SystemExit('Unsupported Mac runner label')
              if runner in [native, gui] or os.environ['HOSTED_DISABLED'] != 'true':
                  entries.append(dict(architecture=arch, machine=machine, runner=runner))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('enabled=' + str(bool(entries)).lower() + '\n')
              out.write('matrix=' + json.dumps({'include': entries}) + '\n')
          PYTHON

  validate-catalog:
    uses: ./.github/workflows/catalog-validation.yml
    with:
      runner: multivibe-linux
    permissions:
      contents: read

  build-linux:
    needs: [validate-tag, validate-catalog]
    runs-on: multivibe-linux
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - name: Require Linux amd64
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] || {
            echo "::error::The Linux provider archive requires an amd64 runner."
            exit 1
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify Linux build dependencies
        run: |
          command -v pkg-config
          pkg-config --exists gtk+-3.0
          command -v zstd
      - name: Install locked build dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund
      - name: Stage the public Cloud demand trust anchor
        shell: bash
        env:
          PROVIDER_DEMAND_TRUSTED_KEYS_JSON: ${{ vars.PROVIDER_DEMAND_TRUSTED_KEYS_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${PROVIDER_DEMAND_TRUSTED_KEYS_JSON:-}" ]]; then
            echo "::error::Missing required repository variable: PROVIDER_DEMAND_TRUSTED_KEYS_JSON"
            exit 1
          fi
          trust_file="$RUNNER_TEMP/provider-demand-trust.json"
          umask 077
          printf '%s' "$PROVIDER_DEMAND_TRUSTED_KEYS_JSON" > "$trust_file"
          printf 'PROVIDER_DEMAND_TRUST_FILE=%s\n' "$trust_file" >> "$GITHUB_ENV"
      - name: Run provider security tests with the race detector
        run: |
          go -C provider-agent test -race ./...
          go -C host/application test -race ./...
          go -C host/updater test -race ./...
          go -C host/menu test -race ./...
      - name: Test provider archive and container hardening
        run: node --test scripts/provider-host/package-provider-host.test.mjs scripts/provider-host/provider-host-container.test.mjs scripts/provider-host/provider-host-native-dependencies.test.mjs scripts/provider-host/provider-host-update-feed.test.mjs scripts/provider-host/provider-host-update-packaging.test.mjs scripts/runtime-benchmark-evidence.test.mjs scripts/provider-host/verify-provider-host-archive-fixtures.test.mjs
      - name: Install the pinned Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan the provider agent for reachable Go vulnerabilities
        working-directory: provider-agent
        run: govulncheck ./...
      - name: Scan the host launcher for reachable Go vulnerabilities
        working-directory: host/application
        run: govulncheck ./...
      - name: Scan the Host updater for reachable Go vulnerabilities
        working-directory: host/updater
        run: govulncheck ./...
      - name: Scan the Linux Host menu for reachable Go vulnerabilities
        working-directory: host/menu
        run: govulncheck ./...
      - name: Build the autonomous Linux archive
        run: >-
          npm run package:provider-host --
          --version "${{ needs.validate-tag.outputs.version }}"
          --output release-linux
          --provider-demand-trust-file "$PROVIDER_DEMAND_TRUST_FILE"
      - name: Verify the Linux archive without executing it
        shell: bash
        run: |
          set -euo pipefail
          archive="release-linux/multivibe-host_${{ needs.validate-tag.outputs.version }}_linux_amd64.tar.gz"
          npm run verify:provider-host -- "$archive"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate the Linux CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          archive="release-linux/multivibe-host_${{ needs.validate-tag.outputs.version }}_linux_amd64.tar.gz"
          scan_root="$RUNNER_TEMP/provider-host-linux-sbom"
          mkdir -p "$scan_root"
          tar -xzf "$archive" -C "$scan_root"
          syft scan "dir:$scan_root" -o "cyclonedx-json=release-linux/multivibe-host_${{ needs.validate-tag.outputs.version }}_linux_amd64.cdx.json"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-linux/multivibe-host_${{ needs.validate-tag.outputs.version }}_linux_amd64.tar.gz
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: release-linux/multivibe-host_${{ needs.validate-tag.outputs.version }}_linux_amd64.tar.gz
          sbom-path: release-linux/multivibe-host_${{ needs.validate-tag.outputs.version }}_linux_amd64.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-host-linux
          path: release-linux/*
          if-no-files-found: error
          compression-level: 0

  build-macos:
    if: ${{ needs.validate-tag.outputs.macos_enabled == 'true' }}
    # A later evidence gate accepts only pre-start quota failures; real build failures still block publishing.
    continue-on-error: true
    needs: [validate-tag, validate-catalog]
    name: build-macos-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-tag.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - name: Require the selected macOS architecture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == "${{ matrix.machine }}" ]] || {
            echo "::error::The macOS provider archive runner architecture is wrong."
            exit 1
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install locked build dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund
      - name: Stage the public Cloud demand trust anchor
        shell: bash
        env:
          PROVIDER_DEMAND_TRUSTED_KEYS_JSON: ${{ vars.PROVIDER_DEMAND_TRUSTED_KEYS_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${PROVIDER_DEMAND_TRUSTED_KEYS_JSON:-}" ]]; then
            echo "::error::Missing required repository variable: PROVIDER_DEMAND_TRUSTED_KEYS_JSON"
            exit 1
          fi
          trust_file="$RUNNER_TEMP/provider-demand-trust.json"
          umask 077
          printf '%s' "$PROVIDER_DEMAND_TRUSTED_KEYS_JSON" > "$trust_file"
          printf 'PROVIDER_DEMAND_TRUST_FILE=%s\n' "$trust_file" >> "$GITHUB_ENV"
      - name: Run provider tests with the race detector
        run: |
          go -C provider-agent test -race ./...
          go -C host/application test -race ./...
          go -C host/updater test -race ./...
      - name: Test provider archive and container hardening
        run: node --test scripts/provider-host/package-provider-host.test.mjs scripts/provider-host/provider-host-container.test.mjs scripts/provider-host/provider-host-native-dependencies.test.mjs scripts/provider-host/provider-host-update-feed.test.mjs scripts/provider-host/provider-host-update-packaging.test.mjs scripts/runtime-benchmark-evidence.test.mjs scripts/provider-host/verify-provider-host-archive-fixtures.test.mjs
      - name: Import ephemeral Apple release credentials
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for variable in CERTIFICATE_P12 CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required Apple release credential: $variable"
              exit 1
            fi
          done
          keychain="$HOME/Library/Keychains/multivibe-signing-${GITHUB_RUN_ID}.keychain-db"
          mkdir -p "$(dirname "$keychain")"
          printf 'SIGNING_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/multivibe-signing.p12"
          developer_id_legacy_ca="$RUNNER_TEMP/DeveloperIDCA.cer"
          developer_id_ca="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          api_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$api_key"
          chmod 600 "$certificate" "$api_key"
          certificate_pem="$RUNNER_TEMP/multivibe-signing.pem"
          openssl pkcs12 -legacy -in "$certificate" -clcerts -nokeys \
            -passin env:CERTIFICATE_PASSWORD -out "$certificate_pem"
          certificate_subject="$(openssl x509 -in "$certificate_pem" -noout -subject -nameopt RFC2253)"
          [[ "$certificate_subject" == *"CN=Developer ID Application:"* ]] || {
            echo "::error::The imported certificate is not a Developer ID Application certificate."
            exit 1
          }
          certificate_fingerprint="$(openssl x509 -in "$certificate_pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          security list-keychains -d user > "$RUNNER_TEMP/multivibe-original-keychains.txt"
          security default-keychain -d user > "$RUNNER_TEMP/multivibe-original-default-keychain.txt"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$developer_id_legacy_ca"
          developer_id_legacy_ca_fingerprint="$(openssl x509 -inform DER -in "$developer_id_legacy_ca" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d :)"
          [[ "$developer_id_legacy_ca_fingerprint" == "7AFC9D01A62F03A2DE9637936D4AFE68090D2DE18D03F29C88CFB0B1BA63587F" ]] || {
            echo "::error::Apple Developer ID certificate fingerprint verification failed."
            exit 1
          }
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$developer_id_ca"
          developer_id_ca_fingerprint="$(openssl x509 -inform DER -in "$developer_id_ca" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d :)"
          [[ "$developer_id_ca_fingerprint" == "F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A" ]] || {
            echo "::error::Apple Developer ID G2 certificate fingerprint verification failed."
            exit 1
          }
          security import "$developer_id_legacy_ca" -k "$keychain"
          security import "$developer_id_ca" -k "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s \
            "$keychain" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning | grep -F -- "$certificate_fingerprint" >/dev/null || {
            security find-identity -p codesigning || true
            security verify-cert -c "$certificate_pem" -p codeSign || true
            echo "::error::The imported Developer ID Application certificate is not a valid code-signing identity."
            exit 1
          }
          printf 'SIGN_IDENTITY=%s\n' "$certificate_fingerprint" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials multivibe-release \
            --key "$api_key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain"
          rm -f "$certificate" "$developer_id_legacy_ca" "$developer_id_ca" "$api_key"
      - name: Build, sign and notarize the macOS archive
        run: >-
          npm run package:provider-host --
          --version "${{ needs.validate-tag.outputs.version }}"
          --output "release-macos-${{ matrix.architecture }}"
          --sign-identity "$SIGN_IDENTITY"
          --notary-profile multivibe-release
          --provider-demand-trust-file "$PROVIDER_DEMAND_TRUST_FILE"
      - name: Remove ephemeral Apple credentials
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shlex, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name, command in [('multivibe-original-keychains.txt', 'list-keychains'), ('multivibe-original-default-keychain.txt', 'default-keychain')]:
              file = root / name
              if file.exists():
                  paths = shlex.split(file.read_text())
                  if paths: subprocess.run(['security', command, '-d', 'user', '-s', *paths], check=True)
                  file.unlink()
          PYTHON
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/multivibe-signing.p12" "$RUNNER_TEMP/multivibe-signing.pem" "$RUNNER_TEMP/AuthKey.p8"
      - name: Verify the signed macOS archive
        shell: bash
        run: |
          set -euo pipefail
          archive="release-macos-${{ matrix.architecture }}/multivibe-host_${{ needs.validate-tag.outputs.version }}_darwin_${{ matrix.architecture }}.dmg"
          node scripts/provider-host/verify-provider-host.mjs "$archive" > "$archive.verification.json"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate the macOS CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          archive="release-macos-${{ matrix.architecture }}/multivibe-host_${{ needs.validate-tag.outputs.version }}_darwin_${{ matrix.architecture }}.dmg"
          scan_root="$RUNNER_TEMP/provider-host-macos-sbom"
          mkdir -p "$scan_root"
          mount_root="$RUNNER_TEMP/provider-host-macos-volume"
          mkdir -p "$mount_root"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount_root" "$archive"
          trap 'hdiutil detach -quiet "$mount_root"' EXIT
          ditto "$mount_root/MultiVibe Host.app" "$scan_root/MultiVibe Host.app"
          syft scan "dir:$scan_root" -o "cyclonedx-json=release-macos-${{ matrix.architecture }}/multivibe-host_${{ needs.validate-tag.outputs.version }}_darwin_${{ matrix.architecture }}.cdx.json"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release-macos-${{ matrix.architecture }}/multivibe-host_${{ needs.validate-tag.outputs.version }}_darwin_${{ matrix.architecture }}.dmg
            release-macos-${{ matrix.architecture }}/multivibe-host_${{ needs.validate-tag.outputs.version }}_darwin_${{ matrix.architecture }}.dmg.verification.json
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: release-macos-${{ matrix.architecture }}/multivibe-host_${{ needs.validate-tag.outputs.version }}_darwin_${{ matrix.architecture }}.dmg
          sbom-path: release-macos-${{ matrix.architecture }}/multivibe-host_${{ needs.validate-tag.outputs.version }}_darwin_${{ matrix.architecture }}.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-host-macos-${{ matrix.architecture }}
          path: release-macos-${{ matrix.architecture }}/*
          if-no-files-found: error
          compression-level: 0

  build-windows:
    if: ${{ vars.HOSTED_RELEASE_BUILDS_ENABLED != 'false' && !inputs.self_hosted_only }}
    continue-on-error: true
    needs: [validate-tag, validate-catalog]
    # node-gyp bundled with the pinned npm supports Visual Studio 2022.
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - name: Require Windows amd64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OS -ne 'Windows_NT' -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'The Windows provider archive requires an amd64 runner.'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install the pinned zstd fixture dependency
        shell: pwsh
        run: choco install zstandard --no-progress --yes
      - name: Install locked build dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Root npm ci failed.' }
          npm --prefix web ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Web npm ci failed.' }
      - name: Stage the public Cloud demand trust anchor
        shell: pwsh
        env:
          PROVIDER_DEMAND_TRUSTED_KEYS_JSON: ${{ vars.PROVIDER_DEMAND_TRUSTED_KEYS_JSON }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PROVIDER_DEMAND_TRUSTED_KEYS_JSON)) {
            throw 'Missing required repository variable: PROVIDER_DEMAND_TRUSTED_KEYS_JSON'
          }
          $trustFile = Join-Path $env:RUNNER_TEMP 'provider-demand-trust.json'
          [System.IO.File]::WriteAllText(
            $trustFile,
            $env:PROVIDER_DEMAND_TRUSTED_KEYS_JSON,
            [System.Text.UTF8Encoding]::new($false)
          )
          "PROVIDER_DEMAND_TRUST_FILE=$trustFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile Windows provider tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($package in @('provider-agent', 'host/application', 'host/updater', 'host/menu')) {
            go -C $package test -run '^$' ./...
            if ($LASTEXITCODE -ne 0) {
              throw "Windows compile-only test check failed for $package"
            }
          }
      - name: Test provider archive and container hardening
        shell: pwsh
        run: node --test scripts/provider-host/package-provider-host.test.mjs scripts/provider-host/provider-host-container.test.mjs scripts/provider-host/provider-host-native-dependencies.test.mjs scripts/provider-host/provider-host-update-feed.test.mjs scripts/provider-host/provider-host-update-packaging.test.mjs scripts/runtime-benchmark-evidence.test.mjs scripts/provider-host/verify-provider-host-archive-fixtures.test.mjs
      - name: Build the Windows amd64 archive
        shell: pwsh
        run: |
          npm run package:provider-host -- --version '${{ needs.validate-tag.outputs.version }}' --output release-windows --provider-demand-trust-file $env:PROVIDER_DEMAND_TRUST_FILE
      - name: Verify the Windows archive without executing hardware checks
        shell: pwsh
        run: |
          $archive = "release-windows/multivibe-host_${{ needs.validate-tag.outputs.version }}_windows_amd64.zip"
          npm run verify:provider-host -- $archive
      - name: Install the pinned Windows installer compiler
        if: vars.WINDOWS_INSTALLER_ENABLED == 'true' && !contains(needs.validate-tag.outputs.version, '-')
        shell: pwsh
        run: ./scripts/distribution/install-inno.ps1
      - name: Build and Authenticode-sign the Windows installer
        if: vars.WINDOWS_INSTALLER_ENABLED == 'true' && !contains(needs.validate-tag.outputs.version, '-')
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.validate-tag.outputs.version }}'
          if ($version -match '-') { throw 'Windows store installers require a stable release.' }
          ./scripts/distribution/build-windows-installer.ps1 -Archive "release-windows/multivibe-host_${version}_windows_amd64.zip" -Version $version -Output release-windows -Compiler "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          ./scripts/distribution/sign-windows-installer.ps1 -Installer "release-windows/multivibe-host_${version}_windows_amd64_setup.exe"
      - name: Attest the Windows installer
        if: vars.WINDOWS_INSTALLER_ENABLED == 'true' && !contains(needs.validate-tag.outputs.version, '-')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-windows/multivibe-host_${{ needs.validate-tag.outputs.version }}_windows_amd64_setup.exe
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate the Windows CycloneDX SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.validate-tag.outputs.version }}'
          $archive = "release-windows/multivibe-host_${version}_windows_amd64.zip"
          $scanRoot = Join-Path $env:RUNNER_TEMP 'provider-host-windows-sbom'
          New-Item -ItemType Directory -Path $scanRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $scanRoot -Force
          syft "dir:$scanRoot" -o "cyclonedx-json=release-windows/multivibe-host_${version}_windows_amd64.cdx.json"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-windows/multivibe-host_${{ needs.validate-tag.outputs.version }}_windows_amd64.zip
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: release-windows/multivibe-host_${{ needs.validate-tag.outputs.version }}_windows_amd64.zip
          sbom-path: release-windows/multivibe-host_${{ needs.validate-tag.outputs.version }}_windows_amd64.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-host-windows
          path: release-windows/*
          if-no-files-found: error
          compression-level: 0

  select-artifacts:
    needs: [validate-tag, build-linux, build-macos, build-windows]
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: multivibe-linux
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      artifact_ids: ${{ steps.select.outputs.artifact_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select successful builds or identify runner quota exclusions
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_DISABLED: ${{ vars.HOSTED_RELEASE_BUILDS_ENABLED == 'false' || inputs.self_hosted_only }}
          MACOS_ARM64_RUNNER: ${{ vars.MACOS_ARM64_RUNNER }}
          MACOS_AMD64_RUNNER: ${{ vars.MACOS_AMD64_RUNNER }}
        run: node scripts/provider-host/select-release-artifacts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-selection
          path: release-platforms.md
          if-no-files-found: error

  sign-release:
    needs: [validate-tag, select-artifacts]
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.select-artifacts.result == 'success' }}
    runs-on: multivibe-linux
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.select-artifacts.outputs.artifact_ids }}
          path: release
          merge-multiple: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Install the pinned GitHub CLI for attestation verification
        shell: bash
        run: |
          set -euo pipefail
          gh_dir="$(mktemp -d "$RUNNER_TEMP/multivibe-release-gh.XXXXXX")"
          printf 'MULTIVIBE_RELEASE_GH_DIR=%s\n' "$gh_dir" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --output "$gh_dir/gh.tar.gz" \
            https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz
          printf '%s  %s\n' e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be "$gh_dir/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$gh_dir/gh.tar.gz" --strip-components=1 -C "$gh_dir"
          rm "$gh_dir/gh.tar.gz"
          printf '%s/bin\n' "$gh_dir" >> "$GITHUB_PATH"
      - name: Ensure GPG is available
        shell: bash
        run: command -v gpg && command -v gh
      - name: Import the GPG release key and sign the artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_FINGERPRINT: ${{ secrets.GPG_SIGNING_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          for variable in GPG_PRIVATE_KEY GPG_FINGERPRINT GPG_PASSPHRASE; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required release-signing credential: $variable"
              exit 1
            fi
          done
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/multivibe-gnupg.XXXXXX")"
          export GNUPGHOME
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | openssl base64 -d -A | gpg --batch --import
          MULTIVIBE_GPG_PASSPHRASE="$GPG_PASSPHRASE" \
            npm run sign:provider-host -- --gpg-key "$GPG_FINGERPRINT" release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/SHA256SUMS
            release/SHA256SUMS.asc
            release/SHA256SUMS.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-host-signed-release
          path: release/*
          if-no-files-found: error
          compression-level: 0

      - name: Remove the temporary GitHub CLI
        if: always()
        shell: bash
        run: |
          if [[ -n "${MULTIVIBE_RELEASE_GH_DIR:-}" ]]; then rm -rf -- "$MULTIVIBE_RELEASE_GH_DIR"; fi

  publish-container:
    needs: [validate-tag, build-linux, sign-release]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && needs.sign-release.result == 'success' }}
    runs-on: multivibe-docker
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-host-linux
          path: release-linux
      - name: Build and exercise the Linux Host image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-tag.outputs.version }}"
          archive="release-linux/multivibe-host_${version}_linux_amd64.tar.gz"
          npm run verify:provider-host -- "$archive"

          context="$RUNNER_TEMP/multivibe-host-container"
          mkdir -p "$context/bundle"
          tar --extract --gzip --file "$archive" --directory "$context/bundle" --strip-components=1
          rm -f -- "$archive"
          cp packaging/container/Dockerfile "$context/Dockerfile"
          cp packaging/container/entrypoint.sh "$context/entrypoint.sh"

          source_commit="$(node --input-type=module --eval "import {readFile} from 'node:fs/promises'; const manifest=JSON.parse(await readFile(process.argv[1],'utf8')); process.stdout.write(manifest.sourceCommit)" "$context/bundle/manifest.json")"
          test "$source_commit" = "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/multivibe-host"
          docker build \
            --platform linux/amd64 \
            --build-arg "MULTIVIBE_VERSION=$version" \
            --build-arg "MULTIVIBE_SOURCE_COMMIT=$source_commit" \
            --tag "$image:$version" \
            "$context"
          test "$(docker run --rm "$image:$version" version)" = "$version"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$version")" = "$source_commit"
          docker tag "$image:$version" "$image:latest"
          printf 'image=%s\nversion=%s\n' "$image" "$version" >> "$GITHUB_OUTPUT"
      - name: Publish the immutable version and rolling latest tags
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="${{ steps.image.outputs.image }}"
          version="${{ steps.image.outputs.version }}"

          set +e
          existing_manifest="$(docker manifest inspect "$image:$version" 2>&1)"
          inspect_status=$?
          set -e
          if [[ "$inspect_status" -eq 0 ]]; then
            echo "::error::The immutable container tag $image:$version already exists; refusing to overwrite it."
            exit 1
          fi
          if [[ "$existing_manifest" != *"manifest unknown"* &&
                "$existing_manifest" != *"no such manifest"* ]]; then
            echo "::error::Could not prove that $image:$version is unused; refusing to publish."
            printf '%s\n' "$existing_manifest" >&2
            exit 1
          fi

          docker push "$image:$version"
          docker push "$image:latest"

          digest="$(docker buildx imagetools inspect "$image:$version" --format '{{.Manifest.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ || "$latest_digest" != "$digest" ]]; then
            echo "::error::Published container tags do not resolve to one valid release digest."
            exit 1
          fi
          node scripts/provider-host/provider-host-container-release.mjs build \
            "$image" "$version" "$digest" "$GITHUB_SHA" container-release
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the published container image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Attest the container release metadata
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: container-release/container-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-host-container-release
          path: container-release/*
          if-no-files-found: error
          compression-level: 0

  publish-release:
    needs: [validate-tag, sign-release, publish-container]
    if: ${{ !cancelled() && needs.sign-release.result == 'success' && needs.publish-container.result == 'success' }}
    runs-on: multivibe-linux
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-host-signed-release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-host-container-release
          path: container-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-platform-selection
          path: release-info
      - name: Generate versioned distribution packages
        if: ${{ !contains(needs.validate-tag.outputs.version, '-') }}
        run: |
          node scripts/distribution/generate.mjs container-release/container-release.json release/SHA256SUMS distribution-packages
          cp -R packaging/truenas/multivibe-host/templates distribution-packages/truenas/multivibe-host/
          cp packaging/truenas/multivibe-host/questions.yaml packaging/truenas/multivibe-host/app_migrations.yaml distribution-packages/truenas/multivibe-host/
          if [ -f "release/multivibe-host_${{ needs.validate-tag.outputs.version }}_windows_amd64_setup.exe" ]; then
            node scripts/distribution/winget.mjs '${{ needs.validate-tag.outputs.version }}' 'release/multivibe-host_${{ needs.validate-tag.outputs.version }}_windows_amd64_setup.exe' distribution-packages/winget
          fi
      - name: Generate release notes and platform download links
        id: release-notes
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_API_BASE_URL: ${{ vars.RELEASE_NOTES_API_BASE_URL }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
        run: node scripts/generate-release-notes.mjs release release-notes.md container-release/container-release-notes.md
      - name: Publish the immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_OUTCOME: ${{ steps.release-notes.outcome }}
          MULTIVIBE_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.MULTIVIBE_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for $GITHUB_REF_NAME; refusing to overwrite it."
            exit 1
          fi
          version="${{ needs.validate-tag.outputs.version }}"
          if [[ -z "${MULTIVIBE_UPDATE_SIGNING_KEY_BASE64:-}" ]]; then
            echo "::error::Missing required update-feed signing credential."
            exit 1
          fi
          node scripts/provider-host/provider-host-container-release.mjs verify \
            container-release/container-release.json "$version" "$GITHUB_SHA"
          if [[ "$version" == *-* ]]; then
            channel=beta
            release_kind=(--prerelease)
          else
            channel=stable
            release_kind=()
          fi
          node scripts/provider-host/build-provider-host-update-feed.mjs \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --channel "$channel" \
            --release-dir release \
            --container-metadata container-release/container-release.json \
            --trusted-key-id 8041964146f75ff5 \
            --trusted-public-key-base64 /TAkcZv7iyGJrPJY1ds1WGxrS7LvoUYnUrYERX2FOgU= \
            --output "release/multivibe-host-update-$channel.json"
          if [[ "$RELEASE_NOTES_OUTCOME" == success && -s release-notes.md ]]; then
            notes_args=(--notes-file release-notes.md)
          else
            echo "::warning::Optional release notes generation failed; using the original release notes."
            notes_args=(--notes "$(<container-release/container-release-notes.md)" --generate-notes)
          fi
          # Always append deterministic availability after optional generated prose.
          if [[ "$RELEASE_NOTES_OUTCOME" == success && -s release-notes.md ]]; then
            printf '\n' >> release-notes.md
            cat release-info/release-platforms.md >> release-notes.md
          else
            cat container-release/container-release-notes.md release-info/release-platforms.md > release-notes.md
            notes_args=(--notes-file release-notes.md --generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" release/* container-release/container-release.json \
            --verify-tag \
            "${release_kind[@]}" \
            --title "MultiVibe Host ${{ needs.validate-tag.outputs.version }}" \
            "${notes_args[@]}"
      - name: Upload catalog submission files
        if: ${{ !contains(needs.validate-tag.outputs.version, '-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages
          path: distribution-packages/
          if-no-files-found: error
