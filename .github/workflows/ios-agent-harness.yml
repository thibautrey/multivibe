name: iOS Pi harness
on:
  pull_request:
    paths: ['native/ios/AgentHarness/**', 'native/ios/MultiVibeChat/Resources/PiAgentCore.js', '.github/workflows/ios-agent-harness.yml']
  push:
    branches: [main]
    paths: ['native/ios/AgentHarness/**', 'native/ios/MultiVibeChat/Resources/PiAgentCore.js', '.github/workflows/ios-agent-harness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/ios/AgentHarness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/ios/AgentHarness/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
